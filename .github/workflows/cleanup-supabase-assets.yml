name: Cleanup unused Supabase assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover active clients
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.clients.outputs.clients }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build client matrix
        id: clients
        working-directory: backend
        run: |
          clients="$(node scripts/list-cleanup-clients.mjs --client all)"
          echo "clients=$clients" >> "$GITHUB_OUTPUT"

  cleanup:
    name: Cleanup ${{ matrix.client }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        client: ${{ fromJSON(needs.discover.outputs.clients) }}
    concurrency:
      group: cleanup-supabase-assets-${{ matrix.client }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run asset cleanup
        env:
          CLIENT_ID: ${{ matrix.client }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLIENT_SUPABASE_CREDENTIALS: ${{ secrets.CLIENT_SUPABASE_CREDENTIALS }}
        run: npm run cleanup:assets -- --client "$CLIENT_ID"
